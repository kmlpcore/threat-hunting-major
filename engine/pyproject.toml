[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "threat-hunting-engine"
version = "0.4.0"
description = "Artefact-based retrospective threat hunting engine (milestones M0-M4)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "pyarrow>=15",
    "pyyaml>=6",
    "httpx>=0.27",
    "pyiceberg[sql-sqlite,s3fs]>=0.9",
    "duckdb>=1.1",
    "tantivy>=0.22",
    "boto3>=1.34",
    "zstandard>=0.22",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

# The repository root is the import root (`import engine.*`, `import benchmarks.*`),
# so this directory is mapped onto the `engine` package.
[tool.setuptools]
package-dir = { "engine" = "." }
packages = ["engine", "engine.common", "engine.cqrs", "engine.api", "engine.generator", "engine.normaliser",
            "engine.summary", "engine.indexer", "engine.features", "engine.seal", "engine.orchestrator", "engine.dashboard"]

[tool.setuptools.package-data]
"engine.dashboard" = ["static/*"]
