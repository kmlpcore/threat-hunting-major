title: Encoded PowerShell command line
id: 7f1c2a6e-1b3d-4d7a-9b0e-0c9a7d1e5a01
description: PowerShell started with an encoded or Base64-decoded script, typical of download cradles.
author: threat-hunting-engine benchmark
status: experimental
tags: [attack.execution, attack.t1059.001, attack.defense_evasion, attack.t1027]
logsource: {category: process_creation, product: windows}
detection:
  selection_img:
    Image|endswith: '\powershell.exe'
  selection_cli:
    CommandLine|contains: [' -enc ', ' -EncodedCommand ', 'FromBase64String']
  condition: selection_img and selection_cli
level: high
