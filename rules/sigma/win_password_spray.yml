title: Password spray from one source
id: 7f1c2a6e-1b3d-4d7a-9b0e-0c9a7d1e5a07
description: One source IP fails to log on as at least 10 different accounts within an hour.
author: threat-hunting-engine benchmark
status: experimental
tags: [attack.credential_access, attack.t1110.003]
correlation:
  type: value_count
  rules: [failed_logon_spray_base]
  group-by: [IpAddress]
  timespan: 1h
  condition: {gte: 10, field: TargetUserName}
level: high
